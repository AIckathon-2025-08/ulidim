static_sites:
- name: web
  source_dir: /
  build_command: npm run build
  output_dir: dist
  index_document: index.html
  environment_slug: node-js
  github:
    repo: AIckathon-2025-08/ulidim
    branch: hosting
    deploy_on_push: true
  envs:
  - key: NODE_ENV
    value: production
  - key: VITE_API_URL
    value: ${api.PUBLIC_URL}/api
  - key: VITE_WS_URL
    value: ${api.PUBLIC_URL}

