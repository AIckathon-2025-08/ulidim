name: two-truths-and-a-lie

ingress:
  rules:
  - match:
      path:
        prefix: /api
    component:
      name: api
  - match:
      path:
        prefix: /
    component:
      name: web

services:
- name: api
  http_port: 8080
  instance_count: 1
  instance_size_slug: basic-xxs
  source_dir: server
  build_command: npm install
  run_command: npm start
  health_check:
    http_path: /api/health
  github:
    repo: AIckathon-2025-08/ulidim
    branch: hosting
    deploy_on_push: true
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "8080"
  - key: FRONTEND_URL
    value: ${web.PUBLIC_URL}
  - key: DB_HOST
    value: ${two-truths-and-a-lie.HOSTNAME}
  - key: DB_PORT
    value: ${two-truths-and-a-lie.PORT}
  - key: DB_NAME
    value: ${two-truths-and-a-lie.DATABASE}
  - key: DB_USER
    value: ${two-truths-and-a-lie.USERNAME}
  - key: DB_PASSWORD
    value: ${two-truths-and-a-lie.PASSWORD}
  - key: SESSION_SECRET
    value: your-super-secret-session-key-change-this-in-production
  - key: ADMIN_USERNAME
    value: admin
  - key: ADMIN_PASSWORD
    value: secure_password_123

static_sites:
- name: web
  source_dir: /
  build_command: npm run build
  output_dir: dist
  index_document: index.html
  environment_slug: node-js
  github:
    repo: AIckathon-2025-08/ulidim
    branch: hosting
    deploy_on_push: true
  envs:
  - key: NODE_ENV
    value: production
  - key: VITE_API_URL
    value: ${api.PUBLIC_URL}/api
  - key: VITE_WS_URL
    value: ${api.PUBLIC_URL}

