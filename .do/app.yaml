name: two-truths-and-a-lie
services:
- name: frontend
  source_dir: /
  github:
    repo: your-username/two-truths-and-a-lie
    branch: master
  run_command: npm run build && npm run preview
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  http_port: 3000
  env:
  - key: VITE_API_URL
    value: ${backend.PUBLIC_URL}/api
  - key: VITE_WS_URL
    value: ${backend.PUBLIC_URL}

- name: backend
  source_dir: /server
  github:
    repo: your-username/two-truths-and-a-lie
    branch: master
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 3001
  env:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3001"
  - key: FRONTEND_URL
    value: ${frontend.PUBLIC_URL}
  - key: DB_HOST
    value: ${db.HOSTNAME}
  - key: DB_PORT
    value: ${db.PORT}
  - key: DB_NAME
    value: ${db.DATABASE}
  - key: DB_USER
    value: ${db.USERNAME}
  - key: DB_PASSWORD
    value: ${db.PASSWORD}
  - key: SESSION_SECRET
    value: your-super-secret-session-key-change-this-in-production
  - key: ADMIN_USERNAME
    value: admin
  - key: ADMIN_PASSWORD
    value: secure_password_123

databases:
- name: db
  engine: PG
  version: "15"