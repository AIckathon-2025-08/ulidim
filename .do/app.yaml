name: two-truths-and-a-lie
services:
- name: app
  type: service
  source_dir: /
  build_command: npm run build && cd server && npm install
  run_command: cd server && npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  health_check:
    http_path: /api/health
  routes:
  - path: /
  env:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "8080"
  - key: FRONTEND_URL
    value: https://whale-app-nbqp6.ondigitalocean.app
  - key: DB_HOST
    value: ${db.HOSTNAME}
  - key: DB_PORT
    value: ${db.PORT}
  - key: DB_NAME
    value: ${db.DATABASE}
  - key: DB_USER
    value: ${db.USERNAME}
  - key: DB_PASSWORD
    value: ${db.PASSWORD}
  - key: SESSION_SECRET
    value: your-super-secret-session-key-change-this-in-production
  - key: ADMIN_USERNAME
    value: admin
  - key: ADMIN_PASSWORD
    value: secure_password_123

databases:
- name: db
  engine: PG
  version: "15"